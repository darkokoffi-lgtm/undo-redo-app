<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek Browser History (Stack Demo)</title>
    <style>
        /* Reset and Body */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e28;
            color: #e6e6f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Panel (Browser Bar) */
        .browser-bar {
            background-color: #28283c;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Buttons */
        button {
            background-color: #6496ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            font-family: 'Segoe UI', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        button:hover:not(:disabled) {
            background-color: #84acff;
            transform: translateY(-2px);
        }

        button:active:not(:disabled) {
            transform: translateY(1px);
        }

        button:disabled {
            background-color: #46465a;
            color: #888;
            cursor: not-allowed;
        }

        /* Address Bar */
        input {
            flex: 1;
            background-color: #1e1e28;
            border: 1px solid #50506a;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            font-family: 'Segoe UI', sans-serif;
            transition: border 0.2s ease;
        }

        input:focus {
            border-color: #6496ff;
        }

        /* Main Display Area */
        .display-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1e1e28;
        }

        h1 {
            font-size: 48px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- Browser Controls -->
    <div class="browser-bar">
        <button id="backBtn" disabled>◀ Back</button>
        <button id="forwardBtn" disabled>Forward ▶</button>
        <input type="text" id="addressBar" value="Home" placeholder="Type a page and press Enter...">
    </div>

    <!-- Webpage Display -->
    <div class="display-area">
        <h1 id="pageDisplay">Welcome to Home</h1>
    </div>

    <script>
        // ==========================================
        // 1. STACK IMPLEMENTATION (JavaScript Arrays)
        // ==========================================
        const backStack = [];
        const forwardStack = [];
        let currentPage = "Home";

        // HTML Elements
        const backBtn = document.getElementById("backBtn");
        const forwardBtn = document.getElementById("forwardBtn");
        const addressBar = document.getElementById("addressBar");
        const pageDisplay = document.getElementById("pageDisplay");

        // ==========================================
        // 2. UPDATE UI
        // ==========================================
        function updateUI() {
            pageDisplay.textContent = "Welcome to " + currentPage;
            
            // Enable/Disable buttons based on stack size
            backBtn.disabled = backStack.length === 0;
            forwardBtn.disabled = forwardStack.length === 0;
        }

        // ==========================================
        // 3. LOGIC: VISIT NEW PAGE
        // ==========================================
        addressBar.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                const newPage = addressBar.value.trim();
                
                if (newPage === "" || newPage === currentPage) return;

                // Push current page to Back Stack
                backStack.push(currentPage);
                
                // Update current page
                currentPage = newPage;
                
                // Clear Forward Stack (new timeline)
                forwardStack.length = 0;
                
                updateUI();
            }
        });

        // ==========================================
        // 4. LOGIC: BACK BUTTON
        // ==========================================
        backBtn.addEventListener("click", function() {
            if (backStack.length > 0) {
                // 1. Push current page to Forward Stack
                forwardStack.push(currentPage);
                
                // 2. Pop from Back Stack to get the previous page
                currentPage = backStack.pop();
                
                // 3. Update Address Bar and UI
                addressBar.value = currentPage;
                updateUI();
            }
        });

        // ==========================================
        // 5. LOGIC: FORWARD BUTTON
        // ==========================================
        forwardBtn.addEventListener("click", function() {
            if (forwardStack.length > 0) {
                // 1. Push current page to Back Stack
                backStack.push(currentPage);
                
                // 2. Pop from Forward Stack to get the next page
                currentPage = forwardStack.pop();
                
                // 3. Update Address Bar and UI
                addressBar.value = currentPage;
                updateUI();
            }
        });
    </script>
</body>
</html>
